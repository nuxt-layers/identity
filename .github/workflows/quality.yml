name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Markdown and architecture provenance
        run: python3 scripts/check_markdown.py

  layer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Disposable database for the database suites (ADR-0002); never a hosted one.
        # Google's mirror of the official Docker Hub image: Docker Hub rate-limits
        # anonymous pulls from shared runners, and AWS ECR Public's anonymous
        # data limit refused them too.
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IDENTITY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Organisation Actions policy permits GitHub-owned or nuxt-layers-owned actions only.
      # Install Corepack locally on the disposable runner; no third-party action or global install.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Install Corepack for pnpm 12
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/corepack" --no-save --ignore-scripts corepack@0.36.0
          echo "$RUNNER_TEMP/corepack/node_modules/.bin" >> "$GITHUB_PATH"
      - run: corepack pnpm --version
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm dev:prepare
      - run: corepack pnpm check
      - run: corepack pnpm build:playground
      - name: Enforce ADR-0012 host composition budget
        run: python3 scripts/check_minimal_host.py
      - name: Build standalone Identity minimal host
        run: corepack pnpm exec nuxt build examples/minimal-host
      - name: Smoke test standalone Identity minimal host
        shell: bash
        run: |
          set -euo pipefail
          PORT=4317 HOST=127.0.0.1 node examples/minimal-host/.output/server/index.mjs > /tmp/identity-minimal-host.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4317/api/health | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/identity-minimal-host.log
            exit 1
          fi
      # The default pages in a real browser, with axe WCAG 2.2 AA checks.
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Gate for the `quality` status check that the master ruleset requires of
  # every repository. It passes only when every check above has passed.
  quality:
    needs: [markdown, layer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Markdown and layer checks passed."
